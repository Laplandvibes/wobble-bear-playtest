</style></head><body><main><header><h1>Wobble Bear</h1><fieldset><legend id="language">Language</legend><button type="button" id="fi" lang="fi">Suomi</button> <button type="button" id="en" lang="en">English</button> <button id="listen" type="button">Listen</button><audio id="welcome" preload="none"></audio></fieldset></header>
<div class="hero"><img src="puronvarsi.webp" alt=""><section class="content"><span class="kicker" id="tag">BROOKSIDE</span><h2 id="headline">Ready, Bear?</h2><p id="how">Try a trail, or pick number seven to jump onto a log and ride the rapids.</p><a class="play" id="play" href="puronvarsi/?lang=en">Play Wobble Bear</a> <a class="alt" id="rapids" href="puronvarsi/?lang=en&amp;trail=rapids">Ride the rapids</a></section></div>

<script>const copy={en:{closet:"Bear’s wardrobe",listen:"Listen",rapids:"Ride the rapids",language:"Language",tag:"BROOKSIDE",headline:"Ready, Bear?",how:"Try a trail, or pick number seven to jump onto a log and ride the rapids.",play:"Play Wobble Bear",forest:"For a different forest, try Forest Friends. All seven trails are here too.",other:"Play Forest Friends"},fi:{closet:"Karhun vaatekaappi",listen:"Kuuntele",rapids:"Laske Teron koski",language:"Kieli",tag:"PURONVARSI",headline:"Lähdetäänkö, karhu?",how:"Valitse metsäretki tai kokeile kenttää seitsemän. Siinä karhu hyppää tukille ja laskee koskea.",play:"Pelaa Wobble Bearia",forest:"Haluatko toiseen metsään? Metsänväessä voit pelata samat seitsemän kenttää.",other:"Pelaa Metsänväkeä"}};
const query=new URL(location.href).searchParams.get("lang");let lang="en";try{if(localStorage.getItem("wobble.language")==="fi")lang="fi"}catch{}if(query==="en"||query==="fi")lang=query;
function choose(l){lang=l;document.documentElement.lang=l;for(const [id,s] of Object.entries(copy[l]))document.getElementById(id).textContent=s;for(const code of ["fi","en"])document.getElementById(code).setAttribute("aria-pressed",String(l===code));document.getElementById("play").href="puronvarsi/?lang="+l;document.getElementById("rapids").href="puronvarsi/?trail=rapids&lang="+l;document.getElementById("closet").href="puronvarsi/?wardrobe=1&lang="+l;document.getElementById("other").href="metsanvaki/?lang="+l;try{localStorage.setItem("wobble.language",l)}catch{}try{const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u)}catch{}}
function speak(){const audio=document.getElementById("welcome");audio.src="welcome-"+lang+".mp3";audio.play().catch(()=>{});} for(const code of ["fi","en"])document.getElementById(code).onclick=()=>{choose(code);speak()};document.getElementById("listen").onclick=speak;choose(lang);</script></body></html>
